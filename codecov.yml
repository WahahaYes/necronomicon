# Coverage is a signal, never a gate: no status blocks a merge. Flags come from build.yml:
# rust-tests from the test job. Carryforward keeps the flag when a PR skips that job
# (only non-Rust files changed).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false
flag_management:
  default_rules:
    carryforward: true
