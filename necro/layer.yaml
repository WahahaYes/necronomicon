guide: |
  Where things live in the engine. All user-facing wording goes through the
  render module, so the output formats stay consistent and snapshot-tested.
files: ["src/**/*.rs"]
rules:
  output:
    summary: "{{found}} writes to the terminal outside the render module"
    why: wording printed from anywhere drifts from the formats the spec pins and the snapshots test
    help: "return the message as data and let src/render/ print it"
    check: { regex: '(?P<found>\b(e?print(ln)?!|std::io::(stdout|stderr)\(\)))' }
    ignores: ["src/render/**", "src/main.rs"]
    explain: |
      ## What the rule says
      Only `src/render/` (and `main`, for exit paths) prints. Everything else
      returns diagnostics or errors as values.

      ## Why
      The spec pins every format (`full`, `terse`, `json`) and stream (stdout
      vs stderr). Printing from deep in a check skips both.
