guide: |
  How exceptions to this repo's rules are written. An allow is a comment,
  `necro-allow <code>: <reason>`, on the flagged line or the line above.
  Every allow carries its reason, and an allow that no longer suppresses
  anything is removed.
rules:
  allow-reason:
    summary: "the allow for {{code}} gives no reason"
    why: an allow without a reason can't be reviewed or revisited later
    help: "write the reason after the code: necro-allow {{code}}: <why this case is fair>"
    check: engine.allow-reason
    explain: |
      ## What the rule says
      Every `necro-allow` comment ends with a reason after the code.

      ## Bad / Good
      `// necro-allow layer/output` → `// necro-allow layer/output: the panic hook must print`
  unused-allow:
    summary: "the allow for {{code}} suppresses nothing"
    why: a stale allow hides the next real hit on that line, and a mistyped code allows nothing
    help: "delete the allow, or fix the code it names"
    check: engine.unused-allow
    ignores: ["spec/**", "src/**/tests/**", "tests/**"] # these write allows as data
    explain: |
      ## What the rule says
      An allow must suppress a hit of the code it names, on its line or the next.

      ## When an exception is fair
      Never inline: files that quote allows as data go in this rule's `ignores`.
