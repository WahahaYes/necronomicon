default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Conformance cases pin exact output bytes.
        exclude: &verbatim ^tests/conformance/
      - id: end-of-file-fixer
        exclude: *verbatim
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
        # Binary media and self-contained html stay out of the size check.
        exclude: '(?i)\.(png|jpe?g|webp|avif|svg|gif|html|glb|gltf)$'
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: *verbatim
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
  # cargo fmt rewrites: the commit fails, and re-staging the fixed file lets it
  # through. clippy only checks.
  - repo: local
    # Non-login shells (IDEs, agents) often lack ~/.cargo/bin on PATH.
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo fmt'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy warnings
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo clippy --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
      - id: necro
        name: necro (this repo's house rules, current build)
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo run -q -- -C src'
        language: system
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no co-author or ai attribution in commit messages
        entry: '(co-authored-by:|noreply@anthropic\.com|generated with .*claude|claude code)'
        language: pygrep
        args: [-i]
        stages: [commit-msg]
