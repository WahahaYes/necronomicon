default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Conformance cases pin exact output bytes.
        exclude: &verbatim ^tests/conformance/
      - id: end-of-file-fixer
        exclude: *verbatim
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
        # Binary media and self-contained html stay out of the size check.
        exclude: '(?i)\.(png|jpe?g|webp|avif|svg|gif|mp4|html|glb|gltf)$'
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: *verbatim
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
  # necro, built from this checkout, runs the house rules and the rust packs:
  # rustfmt (applied by --fix: the commit fails until the fixed files are
  # re-staged), clippy's warnings and the rest.
  - repo: local
    # Non-login shells (IDEs, agents) often lack ~/.cargo/bin on PATH.
    hooks:
      - id: necro
        name: necro (this repo's house rules, current build)
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo run -q -- --fix "$@"' necro
        language: system
        always_run: true
        require_serial: true
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no co-author or ai attribution in commit messages
        entry: '(co-authored-by:|noreply@anthropic\.com|generated with .*claude|claude code)'
        language: pygrep
        args: [-i]
        stages: [commit-msg]
