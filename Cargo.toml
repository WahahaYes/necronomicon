[package]
name = "necronomicon"
version = "0.2.0"
edition = "2024"
# The pinned toolchain (rust-toolchain.toml): the only one CI builds with.
rust-version = "1.98"
description = "Agent mind control for your codebase: house rules that teach. Pre-commit checks tell coding agents what's wrong, why, and what to do instead."
license = "Apache-2.0"
repository = "https://github.com/WahahaYes/necronomicon"
readme = "README.md"
# The crate (and the sdist maturin builds from it) is what builds `necro`; the
# conformance suite, examples and docs stay in the repo.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "necro"
path = "src/main.rs"

[dependencies]
# serde-saphyr's own parser: YAML events with positions for config errors.
granit-parser = { version = "=2.0.0", default-features = false, features = ["std", "error_messages"] }
globset = "0.4.16"
regex = "1.12"

[profile.release]
strip = true
