# pre-commit's remote-repo form. It builds necro from source, so it needs
# Rust; the README's hook installs the PyPI wheel instead.
- id: necro
  name: necro
  description: House rules, enforced by messages that teach the rule and the fix.
  entry: necro
  language: python
  # Each rule's command chooses its own files, so necro takes none.
  pass_filenames: false
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
