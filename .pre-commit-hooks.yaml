# Pin from a repo's .pre-commit-config.yaml:
#   - repo: https://github.com/WahahaYes/necronomicon
#     rev: <tag or sha>
#     hooks: [{ id: necro }]
# Until wheels are on PyPI, installing builds the binary with cargo (needs Rust).
- id: necro
  name: necro
  description: House rules, enforced by messages that teach the rule and the fix.
  entry: necro
  language: python
  # Each rule's command chooses its own files, so necro takes none.
  pass_filenames: false
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
