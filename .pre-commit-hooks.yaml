# pre-commit's remote-repo form. It builds necro from source, so it needs
# Rust; the README's hook installs the PyPI wheel instead.
- id: necro
  name: necro
  description: House rules, enforced by messages that teach the rule and the fix.
  entry: necro --fix
  language: python
  # The changed files narrow the run (spec: Narrowed runs); always_run makes
  # a delete-only commit, with no files to pass, a full run.
  pass_filenames: true
  always_run: true
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
