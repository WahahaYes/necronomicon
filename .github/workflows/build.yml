# Pre-commit, tests, a Linux wheel and the crate. Every job step is one local
# command (see Makefile): make check, make lint, make test-verbose, make wheel,
# make package. Runs on pull requests and pushes to main. release.yml calls
# this before its wheel matrix; it grants actions: write, which purge_caches
# asks for.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only pull requests are filtered; pushes and release calls run everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'rust-toolchain.toml'
              - 'Makefile'
              - '.github/workflows/**'

  # Every hook on all files except the ones that compile (clippy and the necro
  # self-check run in the test job), as the first and cheapest gate.
  precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Rust toolchain (rustfmt, from rust-toolchain.toml)
        run: rustup toolchain install
      # A version written into the source or docs goes stale at the next bump.
      - name: No hardcoded versions
        run: uv run --no-project scripts/release-meta.py stale
      - name: Pre-commit environments cache
        id: pc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Hooks (all files)
        # gitleaks scans staged changes, which CI has none of; it runs below
        # over the pushed commits instead.
        env:
          SKIP: gitleaks,cargo-clippy,necro
        run: make check
      - name: Pre-commit environments cache save
        if: github.ref == 'refs/heads/main' && steps.pc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Secrets (gitleaks, pushed commits)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          case "$RANGE" in
            0000000*|..*) RANGE="HEAD~1..HEAD" ;;
          esac
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact -v --log-opts "$RANGE"
      - name: Commit messages (no ai attribution)
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            uvx pre-commit@4.6.1 run no-ai-attribution --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/msg" || { echo "bad message in $sha"; exit 1; }
          done

  test:
    needs: [changes, precommit]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The conformance suite and its scripted rules run with uv run --script.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main seeds caches every PR reads; PR runs never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make lint
      - run: make test-verbose

  # Proves the wheel builds and installs a working `necro`, the way pre-commit
  # will get it, and that the crate builds from what crates.io would get.
  wheel:
    needs: [changes, precommit]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make wheel
      - name: Install and run
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" target/wheels/*.whl
          "$RUNNER_TEMP/venv/bin/necro" --version
      - name: The installed necro on each example
        run: for d in examples/*/; do "$RUNNER_TEMP/venv/bin/necro" -C "$d" || exit 1; done
      - run: make package

  # The only required check; a skipped job counts as a pass.
  ci:
    runs-on: ubuntu-24.04
    needs: [changes, precommit, test, wheel]
    if: always()
    steps:
      - name: Gate
        run: |
          fail=0
          for r in "${{ needs.changes.result }}" "${{ needs.precommit.result }}" "${{ needs.test.result }}" "${{ needs.wheel.result }}"; do
            echo "result: $r"
            case "$r" in success|skipped) ;; *) fail=1 ;; esac
          done
          # precommit never skips: skipped there means a broken workflow.
          [ "${{ needs.precommit.result }}" = success ] || fail=1
          exit $fail

  # Main seeds the caches PRs read; drop everything else once main is built.
  purge_caches:
    runs-on: ubuntu-24.04
    needs: [precommit, test, wheel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prune non-main caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --json id,ref --limit 100 --jq '.[] | select(.ref != "refs/heads/main") | .id' | while read -r id; do
            [ -n "$id" ] && gh cache delete --repo "$GITHUB_REPOSITORY" "$id" || true
          done
