# necronomicon's own house rules, run by the current build (the necro hook in
# .pre-commit-config.yaml). Format: spec/v0.md.
version: 0
include: [necro:rust, necro:rust-style, necro:agent-files] # packs built into this necro
# Conformance cases quote rules and allows as data; each example is its own
# adopting repo with its own necro.yaml.
exclude: ^(tests/conformance/cases|examples)/
rules:
  render-only-prints:
    command: >-
      necro grep --skip-comments // '\be?print(ln)?!|std::io::std(out|err)\(\)'
      -- 'src/*.rs' ':!src/render/*' ':!src/main.rs'
    message: printing outside the render module
    why: wording printed from anywhere drifts from the formats the spec pins and the conformance suite tests.
    fix: return the message as data and let render/ print it.
    details: |
      Only `render/` (and `main`, for exit paths) prints. Everything else
      returns hits, errors and finder output as values. The spec pins every
      format and stream (stdout vs stderr); printing from deep in the engine
      skips both.
    examples:
      bad: 'eprintln!("necro: check error: {rule}");'
      good: 'report.problems.push(Problem::Check { rule, message, stderr });'
  readme-absolute-links:
    command: >-
      necro grep '\]\((\./|\.\./)?[A-Za-z0-9_.-]+[/)#]|src="[^h"][^"]*"' -- README.md
    message: a relative link in the README
    why: PyPI shows the README without the repo around it, so relative links and images break on the package page, and a published version's README can't be changed.
    fix: link to https://github.com/WahahaYes/necronomicon/blob/main/<path> (tree/ for a folder), and load images from https://raw.githubusercontent.com/WahahaYes/necronomicon/main/<path>.
    examples:
      bad: '[spec/v0.md](spec/v0.md)'
      good: '[spec/v0.md](https://github.com/WahahaYes/necronomicon/blob/main/spec/v0.md)'
  # Local only, not a pack: adopters have no plugins/ or .agents/plugins/
  # dirs. The copies are re-copied from canonical at release (release-meta.py
  # sync-skills); the rule keeps them in sync between releases.
  plugin-skills-sync:
    command: python3 scripts/release-meta.py sync-skills --check
    files: '(^|/)(necro|necro-rules|necro-adopt)/SKILL\.md$'
    autofix: python3 scripts/release-meta.py sync-skills {files}
    message: a plugin skill copy that differs from its canonical skill
    why: the canonical `.agents/skills/<name>/SKILL.md` is the source; the copies under `plugins/` and `.agents/plugins/` are re-copied from it at release, so an edit to a copy alone is lost and an edit to canonical alone leaves stale copies.
    fix: edit the canonical skill, never a copy, then run `necro --fix` to re-copy it into every harness plugin dir.
